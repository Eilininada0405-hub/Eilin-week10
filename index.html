<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl rounded-2xl bg-white p-6 shadow-xl">
      <h1 class="mb-6 text-center text-2xl font-bold text-slate-800">GitHubユーザー検索</h1>

      <div class="flex flex-col gap-3 sm:flex-row">
        <input
          id="username"
          type="text"
          placeholder="GitHubのユーザー名を入力"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        />
        <button
          id="searchButton"
          class="rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300"
        >
          検索
        </button>
      </div>

      <p id="status" class="mt-4 hidden text-sm text-slate-500">読み込み中...</p>

      <div id="result" class="mt-6"></div>
    </div>

    <script>
      const usernameInput = document.getElementById("username");
      const searchButton = document.getElementById("searchButton");
      const statusText = document.getElementById("status");
      const resultBox = document.getElementById("result");

      function setLoading(isLoading) {
        statusText.classList.toggle("hidden", !isLoading);
        searchButton.disabled = isLoading;
      }

      function showError(message) {
        resultBox.innerHTML = `
          <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-700">
            ${message}
          </div>
        `;
      }

      function renderUser(user) {
        const name = user.name || "名前なし";
        const bio = user.bio || "自己紹介はまだありません";

        resultBox.innerHTML = `
          <div class="space-y-4 rounded-xl border border-slate-200 bg-slate-50 p-4">
            <div class="flex items-center gap-4">
              <img
                src="${user.avatar_url}"
                alt="${user.login} avatar"
                class="h-20 w-20 rounded-full border-2 border-slate-200 object-cover"
              />
              <div>
                <h2 class="text-xl font-bold text-slate-800">${name}</h2>
                <p class="text-sm text-slate-500">@${user.login}</p>
              </div>
            </div>

            <div class="space-y-2 text-sm text-slate-700">
              <p><span class="font-semibold">自己紹介:</span> ${bio}</p>
              <p><span class="font-semibold">フォロワー数:</span> ${user.followers}</p>
              <p><span class="font-semibold">公開リポジトリ数:</span> ${user.public_repos}</p>
            </div>

            <a
              href="${user.html_url}"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700"
            >
              GitHubプロフィールを見る
            </a>
          </div>
        `;
      }

      async function fetchGitHubUser() {
        const username = usernameInput.value.trim();

        if (!username) {
          showError("ユーザー名を入力してください");
          return;
        }

        setLoading(true);
        resultBox.innerHTML = "";

        try {
          const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);
          console.log("response:", response);

          if (!response.ok) {
            throw new Error("ユーザーが見つかりませんでした");
          }

          const user = await response.json();
          console.log("GitHub API data:", user);

          renderUser(user);
        } catch (error) {
          console.error(error);
          showError(error.message);
        } finally {
          setLoading(false);
        }
      }

      searchButton.addEventListener("click", fetchGitHubUser);
      usernameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          fetchGitHubUser();
        }
      });
    </script>
  </body>
</html>
